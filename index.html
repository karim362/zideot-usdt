<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zideot USDT | اربح USDT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="logo-container">
            <img src="https://cryptologos.cc/logos/tether-usdt-logo.png?v=026" alt="USDT Logo" class="logo">
            <h1>Zideot USDT</h1>
        </div>
        <div class="balance-card">
            <p class="balance-title">رصيدك الحالي</p>
            <div class="balance-amount">
                <span id="balance">0.0000000</span> <span class="currency">USDT</span>
            </div>
            <p class="balance-subtitle">كل 10 إعلانات = 1.0000000 USDT</p>
        </div>
        <div class="action-area">
            <button id="watchAdBtn" class="btn-primary">
                <span class="icon">▶</span> مشاهدة إعلان (+0.1)
            </button>
            <p id="statusMessage" class="status-text">اضغط على الزر لزيادة نقاطك</p>
            
            <div style="display: flex; gap: 10px; width: 100%; margin-top: 10px;">
                <button id="showBalanceBtn" class="btn-secondary">💳 رصيدي</button>
                <button id="showRefsBtn" class="btn-secondary">👥 إحالاتي</button>
            </div>
            <button id="withdrawBtn" class="btn-primary" style="background: #26A17B; margin-top: 10px; width: 100%;">
                💸 سحب الأرباح (الحد الأدنى 10 USDT)
            </button>
        </div>
        <div class="bottom-nav">
            <div class="nav-item active">الرئيسية</div>
            <div class="nav-item">المهام</div>
            <div class="nav-item">الإحالة</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
